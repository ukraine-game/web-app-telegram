<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>TG Clicker</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --tg-blue: #24A1DE;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
            user-select: none;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Fixed Header */
        .header {
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(30, 41, 59, 0.9);
            border-bottom: 1px solid #334155;
            z-index: 10;
        }

        .user-block {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: var(--tg-blue);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            border: 2px solid #38bdf8;
        }

        .user-name {
            font-size: 14px;
            font-weight: 600;
            max-width: 100px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .header-balance {
            display: flex;
            align-items: center;
            gap: 5px;
            background: rgba(0,0,0,0.3);
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid #334155;
        }

        .tg-logo-small {
            width: 18px;
            height: 18px;
        }

        /* Content Area */
        .content {
            flex-grow: 1;
            position: relative;
            overflow-y: auto;
            padding-bottom: 80px; /* Space for nav */
        }

        /* Main Tap View */
        .tap-view {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
        }

        .main-logo-container {
            position: relative;
            margin: 40px 0;
        }

        .main-tg-logo {
            width: 220px;
            height: 220px;
            cursor: pointer;
            transition: transform 0.1s;
            filter: drop-shadow(0 0 30px rgba(36, 161, 222, 0.3));
        }

        .main-tg-logo:active {
            transform: scale(0.92);
        }

        /* Floating Text */
        .float-text {
            position: absolute;
            color: #38bdf8;
            font-weight: bold;
            font-size: 28px;
            pointer-events: none;
            animation: floatUp 0.7s ease-out forwards;
            z-index: 100;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-120px); }
        }

        /* Stats Bar */
        .energy-bar-container {
            width: 80%;
            margin-bottom: 20px;
        }

        .energy-info {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin-bottom: 6px;
        }

        .progress-bg {
            height: 12px;
            background: #1e293b;
            border-radius: 10px;
            border: 1px solid #334155;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #24A1DE, #38bdf8);
            width: 100%;
            transition: width 0.3s;
        }

        /* Lists and Cards */
        .tab-content {
            display: none;
            padding: 20px;
        }

        .tab-content.active {
            display: block;
        }

        .card {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #334155;
        }

        .profile-info-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #334155;
        }

        .profile-info-row:last-child { border: none; }

        /* Navigation */
        .nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            display: flex;
            background: #1e293b;
            padding: 10px 0 25px; /* Extra padding for iPhone notches */
            border-top: 1px solid #334155;
        }

        .nav-item {
            flex: 1;
            text-align: center;
            font-size: 12px;
            color: #94a3b8;
        }

        .nav-item.active {
            color: var(--tg-blue);
        }

        .btn-buy {
            background: var(--tg-blue);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="user-block">
            <div id="avatar" class="avatar">?</div>
            <div id="display-name" class="user-name">Гість</div>
        </div>
        <div class="header-balance">
            <img src="https://telegram.org/img/t_logo.png" class="tg-logo-small">
            <span id="balance-val" style="font-weight: bold;">0</span>
        </div>
    </div>

    <div class="content">
        <div id="main" class="tab-content active">
            <div class="tap-view">
                <div class="main-logo-container" id="tap-area">
                    <img src="https://telegram.org/img/t_logo.png" class="main-tg-logo" id="tg-target">
                </div>
                
                <div class="energy-bar-container">
                    <div class="energy-info">
                        <span>⚡ Енергія</span>
                        <span id="energy-text">200 / 200</span>
                    </div>
                    <div class="progress-bg">
                        <div id="energy-fill" class="progress-fill"></div>
                    </div>
                </div>
                <p style="color: #64748b; font-size: 14px;">Натапано всього: <span id="total-taps">0</span></p>
            </div>
        </div>

        <div id="upgrades" class="tab-content">
            <h2 style="margin-top:0">Покращення</h2>
            <div class="card">
                <div>
                    <div style="font-weight: bold;">Multi-Tap</div>
                    <div style="font-size: 12px; color: #94a3b8;">+1 до кліку</div>
                </div>
                <button class="btn-buy" onclick="buy('tap')"><span id="price-tap">100</span> TG</button>
            </div>
            <div class="card">
                <div>
                    <div style="font-weight: bold;">Макс. Енергія</div>
                    <div style="font-size: 12px; color: #94a3b8;">+100 ліміту</div>
                </div>
                <button class="btn-buy" onclick="buy('energy')"><span id="price-energy">150</span> TG</button>
            </div>
        </div>

        <div id="profile" class="tab-content">
            <h2 style="margin-top:0">Мій Профіль</h2>
            <div class="card" style="display: block;">
                <div class="profile-info-row">
                    <span>Ім'я:</span>
                    <span id="p-name" style="font-weight: bold;">-</span>
                </div>
                <div class="profile-info-row">
                    <span>Username:</span>
                    <span id="p-username" style="color: var(--tg-blue);">-</span>
                </div>
                <div class="profile-info-row">
                    <span>Telegram ID:</span>
                    <span id="p-id" style="font-family: monospace;">-</span>
                </div>
                <div class="profile-info-row">
                    <span>Статус:</span>
                    <span style="color: #10b981;">Активний</span>
                </div>
            </div>
            <p style="text-align: center; color: #64748b; font-size: 12px;">Версія додатку: 1.0.2</p>
        </div>
    </div>

    <div class="nav">
        <div class="nav-item active" onclick="switchTab('main', this)">🏠 Головна</div>
        <div class="nav-item" onclick="switchTab('upgrades', this)">🚀 Покращення</div>
        <div class="nav-item" onclick="switchTab('profile', this)">👤 Профіль</div>
    </div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // Game State
    let balance = 0;
    let energy = 200;
    let maxEnergy = 200;
    let perClick = 1;
    let prices = { tap: 100, energy: 150 };

    // Initialization with Data Check
    function initUser() {
        const user = tg.initDataUnsafe?.user;
        
        if (user) {
            // Header
            document.getElementById('display-name').innerText = user.first_name;
            const avatarBox = document.getElementById('avatar');
            
            if (user.photo_url) {
                avatarBox.innerHTML = `<img src="${user.photo_url}" style="width:100%;height:100%;border-radius:50%">`;
            } else {
                avatarBox.innerText = user.first_name.charAt(0).toUpperCase();
            }

            // Profile Tab
            document.getElementById('p-name').innerText = user.first_name + (user.last_name ? ' ' + user.last_name : '');
            document.getElementById('p-username').innerText = user.username ? '@' + user.username : 'немає';
            document.getElementById('p-id').innerText = user.id;
        } else {
            console.log("Дані не знайдені. Спробуйте відкрити через Telegram.");
        }
    }

    // Tapping Logic
    const tgTarget = document.getElementById('tg-target');
    tgTarget.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (energy >= perClick) {
            balance += perClick;
            energy -= perClick;
            
            // Effect
            const touch = e.touches[0];
            createParticle(touch.clientX, touch.clientY);
            
            updateUI();
            tg.HapticFeedback.impactOccurred('light');
        }
    });

    function createParticle(x, y) {
        const p = document.createElement('div');
        p.className = 'float-text';
        p.innerText = `+${perClick}`;
        p.style.left = x + 'px';
        p.style.top = y + 'px';
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 700);
    }

    function updateUI() {
        document.getElementById('balance-val').innerText = Math.floor(balance);
        document.getElementById('total-taps').innerText = Math.floor(balance);
        document.getElementById('energy-text').innerText = `${energy} / ${maxEnergy}`;
        document.getElementById('energy-fill').style.width = (energy / maxEnergy * 100) + '%';
        
        document.getElementById('price-tap').innerText = prices.tap;
        document.getElementById('price-energy').innerText = prices.energy;
    }

    // Upgrades
    function buy(type) {
        if (type === 'tap' && balance >= prices.tap) {
            balance -= prices.tap;
            perClick++;
            prices.tap = Math.floor(prices.tap * 1.8);
        } else if (type === 'energy' && balance >= prices.energy) {
            balance -= prices.energy;
            maxEnergy += 100;
            energy += 100;
            prices.energy = Math.floor(prices.energy * 2);
        }
        updateUI();
    }

    // Navigation
    function switchTab(tabId, el) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        el.classList.add('active');
    }

    // Energy Regen
    setInterval(() => {
        if (energy < maxEnergy) {
            energy = Math.min(maxEnergy, energy + 1);
            updateUI();
        }
    }, 1500);

    initUser();
    updateUI();
</script>
</body>
</html>
