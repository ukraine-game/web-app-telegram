<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>TG Star Clicker Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --tg-blue: #24A1DE;
            --bg-color: #070b14;
            --card-bg: #151e2d;
            --text-color: #ffffff;
            --gray: #94a3b8;
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
            user-select: none;
        }

        .container { display: flex; flex-direction: column; height: 100vh; }

        /* Header */
        .header {
            padding: 15px 20px;
            display: flex; align-items: center; justify-content: space-between;
            background: #111827; border-bottom: 2px solid #1e293b;
        }

        .user-info { display: flex; align-items: center; gap: 10px; }
        .avatar {
            width: 40px; height: 40px; border-radius: 50%;
            background: linear-gradient(45deg, var(--tg-blue), #38bdf8);
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; border: 2px solid #334155;
        }

        /* Main Game Area */
        .content { flex-grow: 1; position: relative; overflow-y: auto; padding-bottom: 90px; }
        .tab-content { display: none; padding: 20px; animation: fadeIn 0.3s ease; }
        .tab-content.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Score Display */
        .score-container { text-align: center; margin-top: 20px; }
        .score-title { font-size: 14px; color: var(--gray); text-transform: uppercase; letter-spacing: 1px; }
        .score-value { 
            font-size: 48px; font-weight: 800; display: flex; 
            align-items: center; justify-content: center; gap: 10px; margin: 5px 0;
        }

        /* Tap Logic */
        .tap-area { display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 30px 0; }
        .tg-button {
            width: 240px; height: 240px; cursor: pointer;
            transition: transform 0.05s;
            filter: drop-shadow(0 0 40px rgba(36, 161, 222, 0.4));
        }
        .tg-button:active { transform: scale(0.92); }

        /* Energy Bar */
        .stats-box { width: 85%; margin: 0 auto; }
        .energy-label { display: flex; justify-content: space-between; margin-bottom: 8px; font-weight: 600; }
        .progress-container { height: 16px; background: #1e293b; border-radius: 20px; border: 2px solid #334155; overflow: hidden; }
        .progress-bar { height: 100%; background: linear-gradient(90deg, #24A1DE, #60a5fa); width: 100%; transition: width 0.2s; }

        /* Cards & Lists */
        .upgrade-item {
            background: var(--card-bg); padding: 16px; border-radius: 16px;
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 12px; border: 1px solid #1e293b;
        }
        .btn-action {
            background: var(--tg-blue); color: white; border: none;
            padding: 10px 18px; border-radius: 12px; font-weight: bold;
        }
        .btn-action:disabled { background: #334155; color: #64748b; }

        /* Profile Details */
        .profile-card { background: var(--card-bg); border-radius: 20px; padding: 20px; border: 1px solid #1e293b; }
        .info-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #1e293b; }
        .info-row:last-child { border: none; }
        .info-label { color: var(--gray); }

        /* Navbar */
        .nav {
            position: fixed; bottom: 0; width: 100%; display: flex;
            background: #111827; padding: 12px 0 30px; border-top: 1px solid #1e293b;
        }
        .nav-item { flex: 1; text-align: center; color: var(--gray); font-size: 12px; font-weight: 500; }
        .nav-item.active { color: var(--tg-blue); }

        .float-n {
            position: absolute; color: var(--tg-blue); font-size: 32px; font-weight: 900;
            pointer-events: none; animation: floatUp 0.8s ease-out forwards;
        }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-100px); } }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="user-info">
            <div id="u-avatar" class="avatar">?</div>
            <div id="u-name" style="font-weight: bold;">Завантаження...</div>
        </div>
        <div style="font-size: 14px; background: #1e293b; padding: 4px 12px; border-radius: 15px;">
            💎 <span id="h-balance">0</span>
        </div>
    </div>

    <div class="content">
        <div id="tab-main" class="tab-content active">
            <div class="score-container">
                <div class="score-title">Натапано телеграмів</div>
                <div class="score-value">
                    <img src="https://telegram.org/img/t_logo.png" style="width: 40px;">
                    <span id="main-balance">0</span>
                </div>
            </div>

            <div class="tap-area">
                <img src="https://telegram.org/img/t_logo.png" id="tap-btn" class="tg-button">
            </div>

            <div class="stats-box">
                <div class="energy-label">
                    <span>⚡ Енергія</span>
                    <span id="energy-val">200 / 200</span>
                </div>
                <div class="progress-container">
                    <div id="energy-bar" class="progress-bar"></div>
                </div>
            </div>
        </div>

        <div id="tab-upgrades" class="tab-content">
            <h2 style="margin-bottom: 20px;">Магазин покращень</h2>
            <div class="upgrade-item">
                <div>
                    <div style="font-weight: bold;">Multi-Tap</div>
                    <div style="font-size: 12px; color: var(--gray);">+1 до сили кліку</div>
                </div>
                <button class="btn-action" onclick="buyUpgrade('tap')"><span id="cost-tap">100</span> TG</button>
            </div>
            <div class="upgrade-item">
                <div>
                    <div style="font-weight: bold;">Енерго-пак</div>
                    <div style="font-size: 12px; color: var(--gray);">+100 до ліміту</div>
                </div>
                <button class="btn-action" onclick="buyUpgrade('energy')"><span id="cost-energy">150</span> TG</button>
            </div>
        </div>

        <div id="tab-profile" class="tab-content">
            <h2 style="margin-bottom: 20px;">Мій профіль</h2>
            <div class="profile-card">
                <div class="info-row">
                    <span class="info-label">Нікнейм:</span>
                    <span id="p-full-name" style="font-weight: bold;">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">ID користувача:</span>
                    <span id="p-id" style="font-family: monospace;">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Мова додатку:</span>
                    <span id="p-lang">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Преміум:</span>
                    <span id="p-premium">Ні</span>
                </div>
            </div>
            <button onclick="tg.close()" class="btn-action" style="width: 100%; margin-top: 20px; background: #ef4444;">Вийти з гри</button>
        </div>
    </div>

    <div class="nav">
        <div class="nav-item active" onclick="showTab('main', this)">🏠 Головна</div>
        <div class="nav-item" onclick="showTab('upgrades', this)">🚀 Покращення</div>
        <div class="nav-item" onclick="showTab('profile', this)">👤 Профіль</div>
    </div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // Game Constants
    const ENERGY_REGEN_PER_SEC = 1;

    // State
    let state = {
        balance: 0,
        energy: 200,
        maxEnergy: 200,
        power: 1,
        lastTime: Date.now(),
        costs: { tap: 100, energy: 150 }
    };

    // 1. Load Data
    function loadData() {
        const saved = localStorage.getItem('tg_clicker_state');
        if (saved) {
            const parsed = JSON.parse(saved);
            state = {...state, ...parsed};
            
            // Offline Energy Recovery Logic
            const now = Date.now();
            const elapsedSecs = Math.floor((now - state.lastTime) / 1000);
            const recovered = elapsedSecs * ENERGY_REGEN_PER_SEC;
            
            state.energy = Math.min(state.maxEnergy, state.energy + recovered);
            state.lastTime = now;
        }
    }

    // 2. Save Data
    function saveData() {
        state.lastTime = Date.now();
        localStorage.setItem('tg_clicker_state', JSON.stringify(state));
    }

    // Initialize User
    function initUser() {
        const user = tg.initDataUnsafe?.user;
        if (user) {
            const name = user.first_name + (user.last_name ? ' ' + user.last_name : '');
            document.getElementById('u-name').innerText = user.first_name;
            document.getElementById('p-full-name').innerText = name;
            document.getElementById('p-id').innerText = user.id;
            document.getElementById('p-lang').innerText = user.language_code.toUpperCase();
            document.getElementById('p-premium').innerText = user.is_premium ? "Так ✨" : "Ні";
            
            if (user.photo_url) {
                document.getElementById('u-avatar').innerHTML = `<img src="${user.photo_url}" style="width:100%;height:100%;border-radius:50%">`;
            } else {
                document.getElementById('u-avatar').innerText = user.first_name[0];
            }
        }
    }

    // UI Updates
    function updateUI() {
        document.getElementById('main-balance').innerText = Math.floor(state.balance);
        document.getElementById('h-balance').innerText = Math.floor(state.balance);
        document.getElementById('energy-val').innerText = `${Math.floor(state.energy)} / ${state.maxEnergy}`;
        document.getElementById('energy-bar').style.width = (state.energy / state.maxEnergy * 100) + '%';
        
        document.getElementById('cost-tap').innerText = state.costs.tap;
        document.getElementById('cost-energy').innerText = state.costs.energy;
        saveData();
    }

    // Tap Event
    const tapBtn = document.getElementById('tap-btn');
    tapBtn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (state.energy >= state.power) {
            state.balance += state.power;
            state.energy -= state.power;
            
            const touch = e.touches[0];
            const p = document.createElement('div');
            p.className = 'float-n';
            p.innerText = `+${state.power}`;
            p.style.left = touch.clientX + 'px';
            p.style.top = touch.clientY + 'px';
            document.body.appendChild(p);
            setTimeout(() => p.remove(), 800);
            
            tg.HapticFeedback.impactOccurred('medium');
            updateUI();
        }
    });

    function buyUpgrade(type) {
        if (type === 'tap' && state.balance >= state.costs.tap) {
            state.balance -= state.costs.tap;
            state.power++;
            state.costs.tap = Math.floor(state.costs.tap * 1.6);
        } else if (type === 'energy' && state.balance >= state.costs.energy) {
            state.balance -= state.costs.energy;
            state.maxEnergy += 100;
            state.energy += 100;
            state.costs.energy = Math.floor(state.costs.energy * 1.5);
        }
        updateUI();
    }

    function showTab(tabId, el) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById('tab-' + tabId).classList.add('active');
        el.classList.add('active');
    }

    // Game Loop (Regen)
    setInterval(() => {
        if (state.energy < state.maxEnergy) {
            state.energy = Math.min(state.maxEnergy, state.energy + ENERGY_REGEN_PER_SEC);
            updateUI();
        }
    }, 1000);

    loadData();
    initUser();
    updateUI();
</script>
</body>
</html>
