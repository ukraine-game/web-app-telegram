<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>TG Star Empire</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --tg-blue: #24A1DE;
            --bg-color: #0b0f19;
            --card-bg: #161c2c;
            --text-color: #ffffff;
            --accent: #38bdf8;
            --gold: #fbbf24;
            --gray: #94a3b8;
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
            user-select: none;
        }

        .container { display: flex; flex-direction: column; height: 100vh; }

        /* Header */
        .header {
            padding: 12px 20px;
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(22, 28, 44, 0.95); border-bottom: 1px solid #2d3748;
            z-index: 10;
        }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .avatar {
            width: 38px; height: 38px; border-radius: 50%;
            background: linear-gradient(45deg, var(--tg-blue), #60a5fa);
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 14px; border: 2px solid #3b82f6;
            overflow: hidden;
        }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        
        .rank-badge {
            font-size: 10px; background: var(--tg-blue); padding: 2px 8px;
            border-radius: 10px; text-transform: uppercase; font-weight: 800;
        }

        /* Score Area */
        .score-section { text-align: center; padding: 20px 0; }
        .score-label { font-size: 12px; color: var(--gray); text-transform: uppercase; letter-spacing: 1.5px; }
        .score-main { 
            font-size: 44px; font-weight: 900; color: white;
            display: flex; align-items: center; justify-content: center; gap: 12px;
        }
        #p-income-text { 
            display: none; font-size: 13px; color: var(--accent); margin-top: 8px;
            background: rgba(56, 189, 248, 0.1); padding: 4px 12px; border-radius: 20px;
        }

        /* Content Area */
        .content { flex-grow: 1; overflow-y: auto; padding-bottom: 100px; }
        .tab-content { display: none; padding: 0 20px; animation: slideUp 0.3s ease; }
        .tab-content.active { display: block; }
        @keyframes slideUp { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        /* Tap Mechanism */
        .tap-box { display: flex; justify-content: center; align-items: center; height: 260px; margin: 10px 0; }
        .tg-coin {
            width: 210px; height: 210px; cursor: pointer;
            transition: transform 0.05s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            filter: drop-shadow(0 0 35px rgba(36, 161, 222, 0.3));
        }
        .tg-coin:active { transform: scale(0.92); }

        /* Stats Bar */
        .stats-wrap { background: var(--card-bg); padding: 15px; border-radius: 20px; margin-bottom: 10px; border: 1px solid #2d3748; }
        .progress-container { height: 12px; background: #1e293b; border-radius: 10px; overflow: hidden; margin-top: 8px; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #3b82f6, #60a5fa); width: 100%; transition: width 0.3s; }

        /* Upgrade Cards */
        .card {
            background: var(--card-bg); padding: 16px; border-radius: 18px;
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 12px; border: 1px solid #2d3748;
        }
        .card-info h4 { margin: 0; font-size: 16px; }
        .card-info p { margin: 4px 0 0; font-size: 11px; color: var(--gray); }
        .btn-upgrade {
            background: var(--tg-blue); color: white; border: none;
            padding: 10px 14px; border-radius: 12px; font-weight: bold; min-width: 85px;
        }

        /* Nav Bar */
        .nav {
            position: fixed; bottom: 0; width: 100%; display: flex;
            background: #111827; padding: 10px 0 25px; border-top: 1px solid #1e293b;
        }
        .nav-item { flex: 1; text-align: center; font-size: 12px; color: #64748b; }
        .nav-item.active { color: var(--tg-blue); font-weight: bold; }

        .float-text {
            position: absolute; color: white; font-weight: 800; font-size: 28px;
            pointer-events: none; animation: popUp 0.8s ease-out forwards;
            z-index: 100;
        }
        @keyframes popUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-120px); } }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="user-info">
            <div id="u-avatar" class="avatar">?</div>
            <div>
                <div id="u-name-head" style="font-size: 14px; font-weight: bold;">Гість</div>
                <div id="u-rank-head" class="rank-badge">Новачок</div>
            </div>
        </div>
        <div style="background: #1e293b; padding: 5px 12px; border-radius: 12px; font-size: 14px; font-weight: bold; color: var(--gold);">
            💰 <span id="h-bal">0</span>
        </div>
    </div>

    <div class="content">
        <div id="tab-main" class="tab-content active">
            <div class="score-section">
                <div class="score-label">Ваш капітал</div>
                <div class="score-main">
                    <img src="https://telegram.org/img/t_logo.png" width="40">
                    <span id="m-bal">0</span>
                </div>
                <div style="height: 30px; margin-top: 5px;">
                    <div id="p-income-text"></div>
                </div>
            </div>

            <div class="tap-box">
                <img src="https://telegram.org/img/t_logo.png" id="tap-coin" class="tg-coin">
            </div>

            <div class="stats-wrap">
                <div style="display: flex; justify-content: space-between; font-size: 14px;">
                    <span>⚡ Енергія</span>
                    <span id="e-val">200 / 200</span>
                </div>
                <div class="progress-container">
                    <div id="e-bar" class="progress-fill"></div>
                </div>
            </div>
        </div>

        <div id="tab-upgrades" class="tab-content">
            <h3 style="margin: 20px 0 15px;">Покращення</h3>
            <div class="card">
                <div class="card-info">
                    <h4>Auto-Clicker 🤖</h4>
                    <p id="auto-desc">1 тап - 0с</p>
                    <p>Ціна: <span id="cost-auto">500</span> TG</p>
                </div>
                <button class="btn-upgrade" onclick="buy('auto')">Level <span id="lv-auto">0</span></button>
            </div>
            </div>

        <div id="tab-profile" class="tab-content">
            <h3 style="margin: 20px 0 15px;">Мій кабінет</h3>
            <div class="card" style="flex-direction: column; align-items: flex-start; gap: 12px;">
                <div style="width:100%; display:flex; justify-content:space-between; border-bottom:1px solid #2d3748; padding-bottom:10px;">
                    <span style="color:var(--gray)">Гравець:</span>
                    <span id="p-name" style="font-weight:bold">-</span>
                </div>
                <div style="width:100%; display:flex; justify-content:space-between; border-bottom:1px solid #2d3748; padding-bottom:10px;">
                    <span style="color:var(--gray)">Ранг:</span>
                    <span id="p-rank" style="color:var(--accent); font-weight:bold">Новачок</span>
                </div>
                <div style="width:100%; display:flex; justify-content:space-between;">
                    <span style="color:var(--gray)">Game ID:</span>
                    <span id="p-game-id" style="font-family:monospace; color:var(--gold)">#---</span>
                </div>
            </div>
            
            <p style="font-size: 11px; color: var(--gray); text-align: center; margin-top: 20px;">
                Версія гри: 1.0.4 <br> Дані синхронізуються локально.
            </p>
        </div>
    </div>

    <div class="nav">
        <div class="nav-item active" onclick="showTab('main', this)">🏠 Головна</div>
        <div class="nav-item" onclick="showTab('upgrades', this)">🚀 Апгрейди</div>
        <div class="nav-item" onclick="showTab('profile', this)">👤 Профіль</div>
    </div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const AUTO_INTERVALS = [0, 5, 4, 3, 2, 1, 0.5];
    const AUTO_COSTS = [500, 1500, 5000, 15000, 50000, 150000];

    let state = {
        bal: 0,
        energy: 200,
        maxEnergy: 200,
        power: 1,
        regen: 1,
        autoLvl: 0,
        gameId: null, // Буде встановлено ботом або при першому вході
        lastTime: Date.now(),
        costs: { tap: 100, energy: 200, regen: 300 }
    };

    function getRank(bal) {
        if (bal < 4000) return "Новачок";
        if (bal < 10000) return "Місцевий";
        if (bal < 15000) return "Досвідчений";
        if (bal < 30000) return "Професіонал";
        if (bal < 50000) return "Бізнесмен";
        if (bal < 100000) return "Проф. Бізнесмен";
        return "Власник";
    }

    function load() {
        const data = localStorage.getItem('star_empire_save_v3');
        if (data) {
            state = {...state, ...JSON.parse(data)};
            const now = Date.now();
            const diff = Math.floor((now - state.lastTime) / 1000);
            
            // Offline auto-clicker
            if (state.autoLvl > 0) {
                const interval = AUTO_INTERVALS[state.autoLvl];
                const earned = Math.floor(diff / interval);
                if (earned > 0) {
                    state.bal += earned;
                    tg.showAlert(`Поки вас не було, ви заробили ${earned} TG!`);
                }
            }
            state.energy = Math.min(state.maxEnergy, state.energy + (diff * (state.regen * 0.5)));
        }
        
        // Симуляція Game ID для оффлайн режиму, якщо бот ще не передав справжній
        if (!state.gameId) {
            state.gameId = Math.floor(Math.random() * 1000) + 100; 
        }
    }

    function save() {
        state.lastTime = Date.now();
        localStorage.setItem('star_empire_save_v3', JSON.stringify(state));
    }

    function initUser() {
        const u = tg.initDataUnsafe?.user;
        if (u) {
            document.getElementById('u-name-head').innerText = u.first_name;
            document.getElementById('p-name').innerText = u.first_name + (u.last_name ? ' ' + u.last_name : '');
            if (u.photo_url) document.getElementById('u-avatar').innerHTML = `<img src="${u.photo_url}">`;
            else document.getElementById('u-avatar').innerText = u.first_name[0];
        }
    }

    function updateUI() {
        const currentRank = getRank(state.bal);
        
        document.getElementById('h-bal').innerText = Math.floor(state.bal);
        document.getElementById('m-bal').innerText = Math.floor(state.bal);
        document.getElementById('e-val').innerText = `${Math.floor(state.energy)} / ${state.maxEnergy}`;
        document.getElementById('e-bar').style.width = (state.energy / state.maxEnergy * 100) + '%';
        
        // Ранги
        document.getElementById('u-rank-head').innerText = currentRank;
        document.getElementById('p-rank').innerText = currentRank;
        document.getElementById('p-game-id').innerText = "#" + state.gameId;

        // Auto-clicker text
        const incomeText = document.getElementById('p-income-text');
        if (state.autoLvl > 0) {
            incomeText.style.display = 'inline-block';
            incomeText.innerText = `🤖 Авто-клікер: 1 тап — ${AUTO_INTERVALS[state.autoLvl]}с`;
        }

        document.getElementById('lv-auto').innerText = state.autoLvl;
        document.getElementById('cost-auto').innerText = AUTO_COSTS[state.autoLvl] || "MAX";
        
        save();
    }

    // Механіка тапу
    document.getElementById('tap-coin').addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (state.energy >= state.power) {
            state.bal += state.power;
            state.energy -= state.power;
            
            const t = e.touches[0];
            const p = document.createElement('div');
            p.className = 'float-text';
            p.innerText = `+${state.power}`;
            p.style.left = t.clientX + 'px';
            p.style.top = t.clientY + 'px';
            document.body.appendChild(p);
            setTimeout(() => p.remove(), 800);
            
            tg.HapticFeedback.impactOccurred('light');
            updateUI();
        }
    });

    function buy(type) {
        if (type === 'auto' && state.autoLvl < 6 && state.bal >= AUTO_COSTS[state.autoLvl]) {
            state.bal -= AUTO_COSTS[state.autoLvl];
            state.autoLvl++;
        }
        // ... (інші покупки залишаються як були)
        updateUI();
    }

    function showTab(id, el) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById('tab-' + id).classList.add('active');
        el.classList.add('active');
    }

    setInterval(() => {
        if (state.autoLvl > 0) state.bal += (1 / (AUTO_INTERVALS[state.autoLvl] * 10));
        if (state.energy < state.maxEnergy) state.energy = Math.min(state.maxEnergy, state.energy + (state.regen / 20));
        updateUI();
    }, 100);

    load();
    initUser();
    updateUI();
</script>
</body>
</html>
